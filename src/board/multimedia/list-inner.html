      </div>
      <select id="searchCtgry" name="searchCtgry" title="분류 선택">
        <option value="">전체 분류</option>
        <option value="CAT_A">카테고리A</option>
        <option value="CAT_B">카테고리B</option>

      </select>
      <select id="searchTy" name="searchTy" title="검색 조건">
        <option value="T">제목</option>
        <option value="TC">제목+내용</option>
        <option value="N">작성자</option>
      </select>
      <input type="text" id="searchQuery" name="searchQuery" placeholder="검색어를 입력하세요" title="검색어">
      <button type="submit">검색</button>
    </form>
  </div>
  <script>
  (function () {
    var sc = document.currentScript;
    if (!sc || !sc.parentNode) return;
    var wrap = sc.closest('.siiru-boardWrap');
    if (!wrap) return;
    var filter = wrap.querySelector('.board-district-filter');
    var sel = wrap.querySelector('#searchCtgry');
    if (!filter || !sel || !filter.querySelectorAll) return;
    var v = sel.value;
    filter.querySelectorAll('button[data-category]').forEach(function (btn) {
      var raw = btn.getAttribute('data-category');
      var tv = raw === null ? '' : raw;
      btn.classList.toggle('on', tv === v);
    });
  })();
  </script>
