<!-- 검색 상태 유지용 hidden form -->
<form id="boardSearchForm" name="boardSearchForm" method="post" hidden>
  <input type="hidden" name="pageId" value="">
  <input type="hidden" id="movePage" name="movePage" value="">
  <input type="hidden" id="boardId" name="boardId" value="">
  <input type="hidden" id="searchTy" name="searchTy" value="">
  <input type="hidden" id="searchQuery" name="searchQuery" value="">
</form>

<div class="card-soft mb-4">
  <div class="ch"><h6>갤러리 등록</h6></div>
  <div class="cb">
    <form id="boardForm" name="boardForm" method="post" enctype="multipart/form-data">
      <input type="hidden" id="action" name="action" value="insert">
      <input type="hidden" id="seq" name="seq" value="">
      <input type="hidden" id="levelSn" name="levelSn" value="0">

      <div class="fg-row mb-3">
        <div class="fg">
          <label>분류</label>
          <select class="form-select" id="ctgrySn" name="ctgrySn">
            <option value="">선택</option>
            <option value="CAT_A">카테고리A</option>
            <option value="CAT_B">카테고리B</option>
            <option value="CAT_C">카테고리C</option>
          </select>
        </div>
        <div class="fg">
          <label>작성자</label>
          <input type="text" class="form-control" id="userNm" name="userNm" maxlength="50" placeholder="작성자명">
        </div>
      </div>

      <div class="fg mb-3">
        <label>제목 <span style="color:var(--danger);">*</span></label>
        <input type="text" class="form-control" id="boardSj" name="boardSj" maxlength="200" placeholder="제목을 입력하세요">
      </div>

      <div class="mb-3 d-flex align-items-center gap-2">
        <input type="checkbox" class="form-check-input m-0" id="noticeAt" name="noticeAt" value="Y">
        <label for="noticeAt" class="m-0" style="font-size:14px;">공지로 등록</label>
      </div>

      <div class="fg mb-3">
        <label>이미지 첨부</label>
        <input type="file" class="form-control" name="fileNm0" accept="image/*">
        <div class="d-flex align-items-center gap-3 mt-2">
          <div class="d-flex align-items-center gap-1">
            <input type="checkbox" class="form-check-input m-0" id="insrtFile0" name="insrtChk[]" value="Y">
            <label for="insrtFile0" style="font-size:13px;">본문에 삽입</label>
          </div>
          <div class="d-flex align-items-center gap-1">
            <input type="checkbox" class="form-check-input m-0" id="thumbFile0" name="thumbChk[]" value="Y">
            <label for="thumbFile0" style="font-size:13px;">썸네일로 사용</label>
          </div>
        </div>
        <small style="color:var(--muted);font-size:12px;margin-top:4px;display:block;">최대 20MB · JPG, PNG, GIF 등 이미지 파일</small>
      </div>

      <div class="fg mb-4">
        <label>내용</label>
        <textarea class="form-control" id="boardCn" name="boardCn" rows="10" placeholder="내용을 입력하세요"></textarea>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn-dark-pill"><i class="fa-solid fa-check"></i> 저장</button>
        <a href="list.html" class="btn-ghost">목록</a>
      </div>
    </form>
  </div>
</div>
