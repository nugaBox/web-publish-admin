<!-- 검색 상태 유지용 hidden form -->
<form id="boardSearchForm" name="boardSearchForm" method="post" action="#" hidden>
  <input type="hidden" name="pageId" value="">
  <input type="hidden" id="movePage" name="movePage" value="">
  <input type="hidden" id="boardId" name="boardId" value="">
  <input type="hidden" id="searchTy" name="searchTy" value="">
  <input type="hidden" id="searchQuery" name="searchQuery" value="">
</form>

<!-- 본문 카드 -->
<div class="card-soft mb-4">
  <div class="ch" style="gap:10px;align-items:flex-start;flex-wrap:wrap;">
    <span class="board-cat cat-g">카테고리A</span>
    <h6 style="flex:1;margin:0;line-height:1.4;">갤러리 게시글 제목 샘플입니다</h6>
  </div>
  <div class="cb">
    <div class="d-flex gap-3 mb-4 pb-4" style="border-bottom:1px solid var(--border);font-size:13px;color:var(--muted);flex-wrap:wrap;">
      <span>작성자: 관리자</span>
      <span>등록일: 2026.01.10</span>
      <span>조회: 42</span>
    </div>

    <div class="board-body mb-4">
      <p>갤러리 게시글 본문 내용이 이곳에 표시됩니다. 행사 또는 활동에 대한 설명을 작성합니다.</p>
    </div>

    <!-- 이미지 갤러리 -->
    <div class="gallery-grid mb-4">
      <div class="placeholder" style="height:200px;">PHOTO PLACEHOLDER</div>
      <div class="placeholder" style="height:200px;">PHOTO PLACEHOLDER</div>
      <div class="placeholder" style="height:200px;">PHOTO PLACEHOLDER</div>
    </div>

    <!-- 첨부파일 -->
    <div class="fg">
      <label>첨부파일</label>
      <ul class="attach-list">
        <li>
          <i class="fa-regular fa-file-zipper"></i>
          <a href="#">사진모음.zip</a>
          <small style="color:var(--muted);">[10 MB / 다운로드 1회]</small>
        </li>
      </ul>
    </div>
  </div>
</div>

<!-- 버튼 -->
<div class="d-flex gap-2 mb-4">
  <a href="write.html?seq=1" class="btn-ghost"><i class="fa-solid fa-pen"></i> 수정</a>
  <button class="btn-ghost" type="button" style="color:var(--danger);"><i class="fa-solid fa-trash"></i> 삭제</button>
  <a href="list.html" class="btn-ghost" style="margin-left:auto;"><i class="fa-solid fa-list"></i> 목록</a>
</div>
